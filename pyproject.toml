[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anytrain"
version = "0.1.0"
description = "Components for building PyTorch and Lightning training code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "lightning>=2.0",
    "einops>=0.7",
]

[project.optional-dependencies]
audio = ["torchcodec>=0.2", "torchaudio>=2.0"]
bicodec = [
    "einx>=0.3",
    "huggingface-hub>=0.23",
    "omegaconf>=2.3",
    "safetensors>=0.5",
    "soundfile>=0.12",
    "soxr>=0.5",
    "spark-tts @ git+https://github.com/rookiejune/Spark-TTS.git@44ddcbf8b382ce5a55a7d500f5e9266c05516bb0",
    "torchaudio>=2.5",
    "transformers>=4.46",
]
chat = ["openai>=1.0", "requests>=2.31", "zai-sdk>=0.2.3"]
dac = ["descript-audio-codec>=1.0"]
logger = ["wandb>=0.16"]
module = ["transformers>=4.51.0"]
muon = ["torch>=2.9"]
peft = ["peft>=0.17.1,<0.21"]
bpe = ["tokenizers>=0.20", "tqdm>=4.0"]
text = ["jiwer>=4.0", "sacrebleu>=2.0"]
translation = ["accelerate>=1.0,<2", "transformers>=4.51.0"]
speech = [
    "jiwer>=4.0",
    "openai-whisper==20250625",
    "sacrebleu>=2.0",
    "soundfile>=0.12",
    "torchaudio>=2.0",
]
flow = ["flow_matching"]
longcat = [
    "huggingface-hub>=0.23",
    "longcat-audio-codec @ git+https://github.com/rookiejune/LongCat-Audio-Codec.git@f338c4fb346bbd040c942ccbe3928bd9a1cb81a0",
    "PyYAML>=6.0",
]
moss-tts = [
    "packaging>=24",
    "torch>=2.9,<2.10",
    "torchaudio>=2.9,<2.10",
    "torchcodec>=0.8,<0.9",
    "transformers==5.0.0",
]
cosyvoice-vllm = [
    "packaging>=24",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.1",
    "vllm==0.11.0",
    "onnxruntime-gpu==1.20.2; sys_platform == 'linux'",
]
tts-vllm-omni = [
    "packaging>=24",
    "transformers>=5.5.3",
    "vllm>=0.26,<0.27",
    "vllm-omni>=0.26,<0.27",
]
qwen-tts = [
    "packaging>=24",
    "qwen-tts @ git+https://github.com/QwenLM/Qwen3-TTS.git@022e286b98fbec7e1e916cb940cdf532cd9f488e",
    "transformers==4.57.3",
]
spark-tts = [
    "huggingface-hub>=0.23",
    "spark-tts @ git+https://github.com/rookiejune/Spark-TTS.git@44ddcbf8b382ce5a55a7d500f5e9266c05516bb0",
    "torchaudio>=2.5",
]
test = ["basedpyright>=1.31", "pytest>=8.0", "ruff>=0.8"]

[project.entry-points."vllm.general_plugins"]
anytrain_cosyvoice = "anytrain.tts.cosyvoice._vllm:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anytrain.example" = [
    "README.md",
    "assets/speech/*.flac",
    "assets/music/*.mp3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP040", "UP046", "UP047"]

[tool.basedpyright]
include = ["src", "examples", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingModuleSource = "error"
