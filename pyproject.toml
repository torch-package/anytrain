[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anytrain"
version = "0.1.0"
description = "Components for building PyTorch and Lightning training code."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4",
    "lightning>=2.0",
    "einops>=0.7",
    "typing-extensions>=4.12",
    "tqdm>=4.0",
]

[project.optional-dependencies]
audio = ["torchcodec>=0.2", "torchaudio>=2.0"]
bicodec = [
    "einx>=0.3",
    "huggingface-hub>=0.23",
    "omegaconf>=2.3",
    "safetensors>=0.5",
    "soundfile>=0.12",
    "soxr>=0.5",
    "torchaudio>=2.5",
    "transformers>=4.46",
]
chat = ["openai>=1.0", "requests>=2.31", "zai-sdk>=0.2.3"]
dac = ["descript-audio-codec>=1.0"]
logger = ["wandb>=0.16"]
module = ["transformers"]
tokenizer = ["tokenizers>=0.20"]
text = ["jiwer>=4.0", "sacrebleu>=2.0"]
speech = [
    "jiwer>=4.0",
    "openai-whisper",
    "sacrebleu>=2.0",
    "soundfile>=0.12",
    "torchaudio>=2.0",
]
flow = ["flow_matching"]
longcat = [
    "huggingface-hub>=0.23",
    "longcat-audio-codec @ git+https://github.com/rookiejune/LongCat-Audio-Codec.git",
]
moss-tts = ["torchaudio>=2.0", "transformers"]
qwen-tts = [
    "qwen-tts@git+https://github.com/QwenLM/Qwen3-TTS.git",
]
unicodec = [
    "huggingface-hub>=0.23",
    "unicodec @ git+https://github.com/rookiejune/UniCodec.git",
]
test = ["basedpyright>=1.31", "pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anytrain.example" = [
    "README.md",
    "assets/speech/*.flac",
    "assets/music/*.mp3",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.basedpyright]
include = ["src", "examples"]
exclude = ["tests"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
